# Build Dockerfile.legacy-vulkan (danfromtico/switch-dev-legacy's OpenGL with
# mesa-switch's NVK beside it) for linux/amd64 and linux/arm64, each on its own
# runner, and publish both under one tag to
# ghcr.io/autorunhq/switch-dev-legacy-vulkan: a pushed tag legacy-vulkan-<date>
# publishes <date> (such as 2026.10.12), and latest.
name: publish-legacy-vulkan
on:
  push:
    tags: ['legacy-vulkan-20*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/autorunhq/switch-dev-legacy-vulkan
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only; the merge job below names them.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.legacy-vulkan
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        run: |
          tag="${TAG#legacy-vulkan-}"
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" \
              $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$tag"
